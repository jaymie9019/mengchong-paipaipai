<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>萌宠排排排</title>
<style>
  :root {
    --bg: #fff5f0;
    --board: #fffdf8;
    --cream: #fff8ee;
    --accent: #ff8fab;
    --accent-dark: #e76f8c;
    --slot-bg: #ffe8ef;
    --charcoal: #2d2d2d;
    --shadow: 0 4px 14px rgba(255, 143, 171, 0.18);
    --radius: 14px;
    --tile: 48px;
    --gap: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

  html, body {
    height: 100%;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    background: linear-gradient(165deg, #fff0f5 0%, #fff8f0 45%, #f0f7ff 100%);
    color: #5a4a4a;
    touch-action: manipulation;
    overscroll-behavior: none;
    -ms-touch-action: manipulation;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100%;
    padding: 10px 8px 24px;
  }

  .app {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }


  .diff-bar {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .diff-chip {
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    border-radius: 999px;
    padding: 6px 12px;
    min-height: 36px;
    border: 2px solid #ffd0dc;
    background: rgba(255,255,255,0.8);
    color: #c07088;
    cursor: pointer;
    box-shadow: 0 2px 0 #f5c4d0;
  }
  .diff-chip.active {
    background: linear-gradient(135deg, #ff8fab, #ff6b9d);
    color: #fff;
    border-color: #ff6b9d;
    box-shadow: 0 3px 0 #e05a80;
  }

  .orient-tip {
    display: none;
    text-align: center;
    font-size: 0.72rem;
    color: #c07088;
    background: rgba(255,255,255,0.7);
    border-radius: 999px;
    padding: 6px 12px;
    margin: -4px auto 0;
    width: fit-content;
    max-width: 100%;
  }
  .orient-tip.show { display: block; }

  /* Header */
  .header {
    text-align: center;
    padding: 8px 4px 0;
  }
  .title {
    font-size: 1.65rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    background: linear-gradient(120deg, #ff6b9d, #ff9e6d, #ffb347);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 2px 0 rgba(255, 200, 180, 0.35);
  }
  .subtitle {
    font-size: 0.75rem;
    color: #c4a0a8;
    margin-top: 2px;
  }
  .stats {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 10px;
    font-size: 0.9rem;
  }
  .stat {
    background: rgba(255,255,255,0.75);
    padding: 6px 14px;
    border-radius: 999px;
    box-shadow: var(--shadow);
    font-weight: 600;
  }
  .stat span { color: var(--accent-dark); }

  /* Board */
  .board-wrap {
    background: var(--board);
    border-radius: 22px;
    padding: 14px 10px 18px;
    box-shadow: var(--shadow), inset 0 0 0 2px rgba(255, 200, 210, 0.45);
    position: relative;
    overflow: hidden;
  }
  .board-wrap::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 12% 18%, rgba(255, 200, 220, 0.35), transparent 40%),
      radial-gradient(circle at 88% 80%, rgba(200, 230, 255, 0.3), transparent 42%);
    pointer-events: none;
  }
  .board {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: var(--gap);
    min-height: 200px;
    position: relative;
    z-index: 1;
    width: 100%;
  }
  .col {
    display: flex;
    flex-direction: column-reverse;
    gap: max(2px, calc(var(--tile) * 0.08));
    width: var(--tile);
    flex: 0 0 var(--tile);
    min-height: 40px;
  }
  .tile {
    width: var(--tile);
    height: var(--tile);
    border-radius: max(8px, calc(var(--tile) * 0.22));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--tile-font, 1.55rem);
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.2s;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.06);
    background: linear-gradient(160deg, #fff 0%, #fff5f0 100%);
    border: 2px solid rgba(255, 200, 210, 0.55);
  }
  .tile.top:not(.blind):hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 6px 0 rgba(0,0,0,0.08), 0 8px 16px rgba(255, 143, 171, 0.28);
  }
  .tile.top:not(.blind):active {
    transform: translateY(0) scale(0.96);
  }
  .tile:not(.top) {
    cursor: default;
    opacity: 0.92;
    filter: brightness(0.97);
  }
  .tile.blind {
    background: linear-gradient(160deg, #3a3a3a 0%, #1f1f1f 100%);
    border-color: #111;
    color: #fff;
    font-size: 1.45rem;
    font-weight: 800;
    cursor: default;
  }
  .tile.blind.top {
    cursor: pointer;
  }
  .tile.blind.top:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.35);
  }
  .tile.flipping {
    animation: flipReveal 0.38s ease;
  }
  @keyframes flipReveal {
    0% { transform: rotateY(90deg) scale(0.85); opacity: 0.4; }
    55% { transform: rotateY(-12deg) scale(1.06); }
    100% { transform: rotateY(0) scale(1); opacity: 1; }
  }
  .tile.flying {
    pointer-events: none;
    z-index: 50;
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.32s;
  }
  .tile.hint {
    animation: hintPulse 0.9s ease infinite;
    outline: 3px solid #ffd166;
    outline-offset: 2px;
  }
  @keyframes hintPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 209, 102, 0.6); }
    50% { box-shadow: 0 0 0 8px rgba(255, 209, 102, 0); }
  }
  .tile.popping {
    animation: popOut 0.4s ease forwards;
  }
  @keyframes popOut {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.25); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
  }

  /* Slots */
  .slots-section {
    background: var(--slot-bg);
    border-radius: 18px;
    padding: 12px 10px 14px;
    box-shadow: var(--shadow);
  }
  .slots-label {
    font-size: 0.78rem;
    color: #c07088;
    text-align: center;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .slots {
    display: flex;
    justify-content: center;
    gap: 6px;
  }
  .slot {
    width: var(--tile);
    height: var(--tile);
    border-radius: max(8px, calc(var(--tile) * 0.22));
    background: rgba(255,255,255,0.65);
    border: 2px dashed rgba(255, 160, 180, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .slot.filled {
    border-style: solid;
    border-color: rgba(255, 180, 200, 0.7);
    background: linear-gradient(160deg, #fff 0%, #fff5f0 100%);
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .slot .slot-emoji {
    font-size: var(--tile-font, 1.55rem);
    line-height: 1;
    transition: transform 0.2s;
  }
  .slot.matching .slot-emoji {
    animation: matchBounce 0.35s ease;
  }
  @keyframes matchBounce {
    0%, 100% { transform: scale(1); }
    40% { transform: scale(1.3); }
  }
  .slot.clearing .slot-emoji {
    animation: popOut 0.4s ease forwards;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    padding: 11px 20px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    min-height: 44px;
  }
  button:active { transform: scale(0.96); }
  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ff8fab, #ff6b9d);
    color: #fff;
    box-shadow: 0 4px 0 #e05a80, 0 6px 14px rgba(255, 107, 157, 0.35);
  }
  .btn-secondary {
    background: #fff;
    color: #e76f8c;
    box-shadow: 0 3px 0 #f5c4d0, 0 4px 10px rgba(0,0,0,0.06);
    border: 2px solid #ffd0dc;
  }
  .btn-hint {
    background: linear-gradient(135deg, #ffe08a, #ffc94a);
    color: #8a5a00;
    box-shadow: 0 3px 0 #e0a820, 0 4px 10px rgba(255, 200, 80, 0.3);
  }

  /* Overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(60, 40, 50, 0.45);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    padding: 20px;
  }
  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .modal {
    background: #fff;
    border-radius: 24px;
    padding: 28px 24px 22px;
    text-align: center;
    max-width: 300px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    transform: scale(0.9) translateY(12px);
    transition: transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  .overlay.show .modal {
    transform: scale(1) translateY(0);
  }
  .modal-emoji {
    font-size: 3rem;
    margin-bottom: 8px;
    display: block;
  }
  .modal h2 {
    font-size: 1.5rem;
    margin-bottom: 6px;
    color: #5a3a45;
  }
  .modal p {
    font-size: 0.88rem;
    color: #a08088;
    margin-bottom: 18px;
    white-space: pre-line;
  }
  .modal-btns {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .modal-btns button { width: 100%; }

  .busy .tile.top { pointer-events: none; }

  /* Landscape: use full width, denser chrome */
  @media (orientation: landscape) {
    body {
      padding: 6px 10px 12px;
      align-items: center;
      min-height: 100dvh;
    }
    .app {
      max-width: min(920px, 100%);
      gap: 8px;
    }
    .title { font-size: 1.25rem; }
    .subtitle { display: none; }
    .stats { margin-top: 4px; gap: 10px; }
    .stat { padding: 4px 12px; font-size: 0.82rem; }
    .board-wrap { padding: 10px 8px 12px; }
    .board { min-height: 140px; }
    .slots-section { padding: 8px 10px 10px; }
    .slots-label { margin-bottom: 6px; }
    .orient-tip { display: none !important; }
  }

  @media (orientation: landscape) and (max-height: 430px) {
    .app {
      display: grid;
      grid-template-columns: 1fr minmax(200px, 280px);
      grid-template-rows: auto 1fr auto;
      gap: 8px 12px;
      align-items: stretch;
    }
    .header { grid-column: 1 / -1; }
    .board-wrap { grid-column: 1; grid-row: 2 / 4; }
    .slots-section { grid-column: 2; grid-row: 2; align-self: end; }
    .controls { grid-column: 2; grid-row: 3; }
    .board { min-height: 120px; max-height: calc(100dvh - 90px); overflow-y: auto; }
  }


  .level-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 4px 0 12px;
    max-height: min(42vh, 280px);
    overflow-y: auto;
    padding: 2px;
  }
  .level-btn {
    min-height: 48px;
    border-radius: 14px !important;
    padding: 8px 4px !important;
    font-size: 0.95rem !important;
    font-weight: 800 !important;
    box-shadow: 0 3px 0 #f5c4d0, 0 4px 10px rgba(0,0,0,0.06) !important;
    border: 2px solid #ffd0dc !important;
    background: #fff !important;
    color: #e76f8c !important;
    position: relative;
  }
  .level-btn.cleared {
    background: linear-gradient(135deg, #fff6e8, #ffe8f0) !important;
  }
  .level-btn.current {
    border-color: #ff8fab !important;
    box-shadow: 0 3px 0 #e05a80, 0 6px 14px rgba(255, 107, 157, 0.35) !important;
    background: linear-gradient(135deg, #ff8fab, #ff6b9d) !important;
    color: #fff !important;
  }
  .level-btn.locked {
    opacity: 0.4;
    cursor: not-allowed !important;
    filter: grayscale(0.4);
  }
  .level-btn .lv-mark {
    display: block;
    font-size: 0.65rem;
    font-weight: 600;
    opacity: 0.85;
    margin-top: 2px;
  }
  .modal.wide {
    max-width: 340px;
  }

  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(50, 40, 45, 0.9);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 200;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .stat.battle-stat {
    background: linear-gradient(135deg, rgba(255,143,171,0.2), rgba(255,200,120,0.25));
    border: 1.5px solid #ffc0d0;
  }
  .stat.battle-stat span { color: #d45a7a; }
  .diff-chip:disabled,
  .diff-bar.locked .diff-chip {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }
  .invite-box {
    background: #fff6f8;
    border: 2px dashed #ffc0d0;
    border-radius: 14px;
    padding: 10px 12px;
    font-size: 0.72rem;
    color: #a07080;
    word-break: break-all;
    text-align: left;
    margin-bottom: 12px;
    max-height: 88px;
    overflow-y: auto;
    line-height: 1.45;
  }
  .modal.battle-modal { max-width: 320px; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <h1 class="title">萌宠排排排</h1>
    <p class="subtitle">翻开盲盒 · 三只成组 · 清空通关</p>
    <div class="stats">
      <div class="stat">第 <span id="levelNum">1</span> 关</div>
      <div class="stat">消除 <span id="scoreNum">0</span></div>
      <div class="stat battle-stat" id="battleBadge" hidden>对战中</div>
      <div class="stat battle-stat" id="battleTimerStat" hidden>⏱ <span id="battleTimer">0.0</span>s</div>
    </div>
    <div class="diff-bar" id="diffBar" role="group" aria-label="难度">
      <button type="button" class="diff-chip" data-diff="easy">简单</button>
      <button type="button" class="diff-chip active" data-diff="normal">普通</button>
      <button type="button" class="diff-chip" data-diff="hard">困难</button>
    </div>
    <p class="orient-tip" id="orientTip">列较多时横过来玩更舒服～</p>
  </header>

  <div class="board-wrap">
    <div class="board" id="board" aria-label="游戏棋盘"></div>
  </div>

  <div class="slots-section">
    <div class="slots-label">槽位（满格且无法消除即失败 · <span id="slotCapLabel">7</span> 格）</div>
    <div class="slots" id="slots"></div>
  </div>

  <div class="controls">
    <button type="button" class="btn-secondary" id="btnLevels">关卡</button>
    <button type="button" class="btn-secondary" id="btnBattle">对战</button>
    <button type="button" class="btn-secondary" id="btnRestart">重新开始</button>
    <button type="button" class="btn-hint" id="btnHint">提示</button>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <span class="modal-emoji" id="modalEmoji">🎉</span>
    <h2 id="modalTitle">通关！</h2>
    <p id="modalMsg">真棒，萌宠们都排好啦～</p>
    <div class="modal-btns" id="modalBtns"></div>
  </div>
</div>

<div class="overlay" id="levelOverlay" role="dialog" aria-modal="true">
  <div class="modal wide">
    <span class="modal-emoji">🗺️</span>
    <h2>选择关卡</h2>
    <p>已通关的可以再玩。难度在上方切换，各难度进度共用关卡解锁。</p>
    <div class="level-grid" id="levelGrid"></div>
    <div class="modal-btns">
      <button type="button" class="btn-secondary" id="btnCloseLevels">关闭</button>
    </div>
  </div>
</div>

<div class="overlay" id="battleOverlay" role="dialog" aria-modal="true">
  <div class="modal battle-modal wide">
    <span class="modal-emoji">⚔️</span>
    <h2>发起对战</h2>
    <p id="battleInviteHint">生成邀请链接，好友打开后会得到同一副牌。比比谁更快通关～</p>
    <div class="invite-box" id="battleInviteLink"></div>
    <div class="modal-btns">
      <button type="button" class="btn-primary" id="btnCopyInvite">复制链接</button>
      <button type="button" class="btn-secondary" id="btnStartBattle">开始对战</button>
      <button type="button" class="btn-secondary" id="btnCloseBattle">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  const ALL_PETS = ["🐧", "🦦", "🐯", "🦉", "🐮", "🐼", "🦊", "🐕", "🦛", "🐦", "🐷", "🐰", "🐸"];
  const SLOT_CAP = 7;
  const DIFFICULTIES = {
    easy: {
      label: "简单",
      colsDelta: -1,
      typesDelta: -1,
      depthDelta: -1,
      blindMul: 0.7,
      slotCap: 8,
    },
    normal: {
      label: "普通",
      colsDelta: 0,
      typesDelta: 0,
      depthDelta: 0,
      blindMul: 1,
      slotCap: 7,
    },
    hard: {
      label: "困难",
      colsDelta: 1,
      typesDelta: 1,
      depthDelta: 1,
      blindMul: 1.25,
      slotCap: 6,
    },
  };
  let difficulty = "normal";

  function slotCap() {
    return (DIFFICULTIES[difficulty] || DIFFICULTIES.normal).slotCap;
  }

  const levelConfigs = [
    { cols: 7, types: 4, depthMin: 3, depthMax: 5, blindRate: 0.35 },
    { cols: 8, types: 5, depthMin: 4, depthMax: 6, blindRate: 0.42 },
    { cols: 9, types: 6, depthMin: 4, depthMax: 6, blindRate: 0.48 },
    { cols: 9, types: 7, depthMin: 5, depthMax: 7, blindRate: 0.5 },
    { cols: 10, types: 8, depthMin: 5, depthMax: 7, blindRate: 0.52 },
    { cols: 11, types: 9, depthMin: 5, depthMax: 8, blindRate: 0.55 },
  ];

  let level = 1;
  let score = 0;
  let columns = []; // columns[c] = [{id, pet, blind}, ...] bottom→top (last = top)
  let slots = [];   // [{id, pet}, ...]
  let busy = false;
  let tileIdSeq = 0;
  let gameOver = false;

  let battleMode = false;
  let battleSeed = 0;
  let battleOpponentTime = null; // ms from invite payload.t
  let battleStartMs = 0; // 0 = not started
  let battleTimerId = null;
  let pendingInvitePayload = null;

  const STORAGE_KEY = "mengchong-paipaipai-save-v1";
  let maxCleared = 0; // highest level the player has beaten

  function saveProgress(extra) {
    if (battleMode) return;
    try {
      const payload = Object.assign(
        {
          level,
          score,
          tileIdSeq,
          gameOver,
          maxCleared,
          difficulty,
          columns: columns.map((stack) =>
            stack.map((t) => ({
              id: t.id,
              pet: t.pet,
              blind: !!t.blind,
            }))
          ),
          slots: slots.map((s) => ({ id: s.id, pet: s.pet })),
          savedAt: Date.now(),
        },
        extra || {}
      );
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    } catch (e) {
      /* private mode / quota */
    }
  }

  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || !Number.isFinite(data.level) || data.level < 1) return null;
      if (!Array.isArray(data.columns) || !Array.isArray(data.slots)) return null;
      return data;
    } catch (e) {
      return null;
    }
  }

  function unlockedLevel() {
    // Can play up to the next uncleared level
    return Math.max(1, maxCleared + 1, level);
  }

  const boardEl = document.getElementById("board");
  const slotsEl = document.getElementById("slots");
  const appEl = document.getElementById("app");
  const overlayEl = document.getElementById("overlay");
  const levelOverlayEl = document.getElementById("levelOverlay");
  const toastEl = document.getElementById("toast");

  function mulberry32(a) {
    return function () {
      let t = (a += 0x6d2b79f5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function randFloat(rng) {
    return rng ? rng() : Math.random();
  }

  function randInt(a, b, rng) {
    return a + Math.floor(randFloat(rng) * (b - a + 1));
  }

  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(randFloat(rng) * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function makeSeed() {
    const a = (Date.now() ^ (Math.random() * 0x100000000)) >>> 0;
    try {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return (a ^ buf[0]) >>> 0;
    } catch (e) {
      return a;
    }
  }

  function toBase64Url(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = "";
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function fromBase64Url(s) {
    let b64 = String(s).replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function encodeBattlePayload(obj) {
    return toBase64Url(JSON.stringify(obj));
  }

  function decodeBattlePayload(raw) {
    try {
      const data = JSON.parse(fromBase64Url(raw));
      if (!data || data.v !== 1) return null;
      if (!Number.isFinite(data.seed)) return null;
      if (!data.d || !DIFFICULTIES[data.d]) return null;
      if (!Number.isFinite(data.lv) || data.lv < 1) return null;
      const out = {
        v: 1,
        seed: data.seed >>> 0,
        d: data.d,
        lv: Math.floor(data.lv),
      };
      if (Number.isFinite(data.t) && data.t >= 0) out.t = Math.floor(data.t);
      return out;
    } catch (e) {
      return null;
    }
  }

  function buildBattleLink(payload) {
    const base = location.origin + location.pathname;
    return base + "?b=" + encodeBattlePayload(payload);
  }

  function formatBattleTime(ms) {
    const t = Math.max(0, ms || 0);
    const sec = t / 1000;
    if (sec < 60) return sec.toFixed(1) + "s";
    const m = Math.floor(sec / 60);
    const s = (sec - m * 60).toFixed(1);
    return m + ":" + (s.length < 4 ? "0" : "") + s;
  }

  function stripBattleQuery() {
    try {
      const url = new URL(location.href);
      if (url.searchParams.has("b")) {
        url.searchParams.delete("b");
        history.replaceState(null, "", url.pathname + url.search + url.hash);
      }
    } catch (e) { /* ignore */ }
  }

  function getConfig(lv) {
    const idx = Math.min(lv - 1, levelConfigs.length - 1);
    const base = levelConfigs[idx];
    // Beyond last config, nudge difficulty
    const extra = Math.max(0, lv - levelConfigs.length);
    const d = DIFFICULTIES[difficulty] || DIFFICULTIES.normal;
    return {
      cols: Math.min(11, Math.max(5, base.cols + Math.floor(extra / 2) + d.colsDelta)),
      types: Math.min(ALL_PETS.length, Math.max(3, base.types + Math.floor(extra / 2) + d.typesDelta)),
      depthMin: Math.min(8, Math.max(2, base.depthMin + Math.floor(extra / 3) + d.depthDelta)),
      depthMax: Math.min(9, Math.max(3, base.depthMax + Math.floor(extra / 3) + d.depthDelta)),
      blindRate: Math.min(0.7, Math.max(0.15, (base.blindRate + extra * 0.02) * d.blindMul)),
    };
  }

  function generateDeal(cfg, rng) {
    // Build depths per column
    const depths = [];
    let total = 0;
    for (let i = 0; i < cfg.cols; i++) {
      const d = randInt(cfg.depthMin, cfg.depthMax, rng);
      depths.push(d);
      total += d;
    }
    // Round total up to multiple of 3
    while (total % 3 !== 0) {
      const c = randInt(0, cfg.cols - 1, rng);
      depths[c]++;
      total++;
    }

    // Choose pets & distribute multiples of 3
    const pets = shuffle(ALL_PETS.slice(), rng).slice(0, cfg.types);
    const counts = {};
    pets.forEach((p) => (counts[p] = 0));

    // Allocate groups of 3 across pets until we fill total
    let remaining = total;
    const bag = [];
    while (remaining > 0) {
      const p = pets[randInt(0, pets.length - 1, rng)];
      bag.push(p, p, p);
      counts[p] += 3;
      remaining -= 3;
    }
    shuffle(bag, rng);

    // Place into columns (bottom → top). Top tiles less often blind.
    const cols = [];
    let idx = 0;
    for (let c = 0; c < cfg.cols; c++) {
      const stack = [];
      const depth = depths[c];
      for (let r = 0; r < depth; r++) {
        const isTop = r === depth - 1;
        // Deeper = more likely blind; tops mostly revealed
        let blind;
        if (isTop) {
          blind = randFloat(rng) < cfg.blindRate * 0.25;
        } else {
          const depthFactor = 1 - r / Math.max(1, depth - 1); // deeper (small r) → higher
          blind = randFloat(rng) < cfg.blindRate * (0.7 + 0.5 * depthFactor);
        }
        stack.push({
          id: ++tileIdSeq,
          pet: bag[idx++],
          blind,
        });
      }
      cols.push(stack);
    }
    return cols;
  }

  function stopBattleTimer() {
    if (battleTimerId) {
      clearInterval(battleTimerId);
      battleTimerId = null;
    }
  }

  function updateBattleTimerDisplay() {
    const el = document.getElementById("battleTimer");
    if (!el) return;
    if (!battleMode) {
      el.textContent = "0.0";
      return;
    }
    const ms = battleStartMs ? Date.now() - battleStartMs : 0;
    el.textContent = (ms / 1000).toFixed(1);
  }

  function startBattleTimerIfNeeded() {
    if (!battleMode || battleStartMs) return;
    battleStartMs = Date.now();
    stopBattleTimer();
    battleTimerId = setInterval(updateBattleTimerDisplay, 100);
    updateBattleTimerDisplay();
  }

  function setBattleUi() {
    const badge = document.getElementById("battleBadge");
    const timerStat = document.getElementById("battleTimerStat");
    const diffBar = document.getElementById("diffBar");
    if (badge) badge.hidden = !battleMode;
    if (timerStat) timerStat.hidden = !battleMode;
    if (diffBar) {
      diffBar.classList.toggle("locked", battleMode);
      diffBar.querySelectorAll(".diff-chip").forEach((btn) => {
        btn.disabled = !!battleMode;
      });
    }
    updateBattleTimerDisplay();
  }

  function enterBattle(seed, lv, diff, opponentTime) {
    battleMode = true;
    battleSeed = seed >>> 0;
    battleOpponentTime = Number.isFinite(opponentTime) ? Math.floor(opponentTime) : null;
    battleStartMs = 0;
    stopBattleTimer();
    difficulty = DIFFICULTIES[diff] ? diff : "normal";
    setBattleUi();
    startLevel(lv, false);
  }

  function exitBattle(opts) {
    const keepGoing = opts && opts.continuePlay;
    battleMode = false;
    battleSeed = 0;
    battleOpponentTime = null;
    battleStartMs = 0;
    pendingInvitePayload = null;
    stopBattleTimer();
    setBattleUi();
    stripBattleQuery();
    hideBattleInvite();
    if (keepGoing) {
      // Resume single-player from saved progress if any
      const saved = loadProgress();
      if (saved) {
        maxCleared = Math.max(maxCleared, Math.floor(saved.maxCleared) || 0);
        if (saved.difficulty && DIFFICULTIES[saved.difficulty]) {
          difficulty = saved.difficulty;
        }
        const hasBoard = saved.columns && saved.columns.some((c) => c && c.length);
        const hasSlots = saved.slots && saved.slots.length > 0;
        if (!saved.pendingDeal && (hasBoard || hasSlots)) {
          restoreProgress(saved);
          return;
        }
        startLevel(Math.max(1, Math.floor(saved.level) || 1), false);
      } else {
        startLevel(level, false);
      }
    }
  }

  function startLevel(lv, keepScore) {
    level = lv;
    if (!keepScore) score = 0;
    gameOver = false;
    busy = false;
    slots = [];
    tileIdSeq = 0;
    clearHints();
    hideOverlay();
    if (battleMode) {
      battleStartMs = 0;
      stopBattleTimer();
      updateBattleTimerDisplay();
    }
    const rng = battleMode ? mulberry32(battleSeed) : null;
    columns = generateDeal(getConfig(level), rng);
    // Ensure tops that aren't blind show pet; blinds show ?
    revealTops();
    updateStats();
    setBattleUi();
    render();
    saveProgress();
  }

  function restoreProgress(data) {
    level = Math.max(1, Math.floor(data.level) || 1);
    score = Math.max(0, Math.floor(data.score) || 0);
    if (data.difficulty && DIFFICULTIES[data.difficulty]) {
      difficulty = data.difficulty;
    }
    if (Number.isFinite(data.maxCleared)) {
      maxCleared = Math.max(maxCleared, Math.floor(data.maxCleared) || 0);
    }
    tileIdSeq = Math.max(0, Math.floor(data.tileIdSeq) || 0);
    gameOver = false;
    busy = false;
    clearHints();
    hideOverlay();
    columns = data.columns.map((stack) =>
      (stack || []).map((t) => ({
        id: t.id,
        pet: t.pet,
        blind: !!t.blind,
      }))
    );
    slots = (data.slots || []).map((s) => ({ id: s.id, pet: s.pet }));
    // Always re-reveal tops after restore
    revealTops();
    // Strip flip animation on cold restore
    columns.forEach((stack) =>
      stack.forEach((t) => {
        t.justFlipped = false;
      })
    );
    updateStats();
    render();
    saveProgress();
    toast(`已恢复第 ${level} 关进度`);
  }

  function revealTops() {
    // Any tile that is currently on top must be face-up (flip with animation).
    columns.forEach((stack) => {
      if (stack.length === 0) return;
      const top = stack[stack.length - 1];
      if (top.blind) {
        top.blind = false;
        top.justFlipped = true;
      }
    });
  }

  function updateStats() {
    document.getElementById("levelNum").textContent = String(level);
    document.getElementById("scoreNum").textContent = String(score);
    const capLabel = document.getElementById("slotCapLabel");
    if (capLabel) capLabel.textContent = String(slotCap());
    document.querySelectorAll("#diffBar .diff-chip").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.diff === difficulty);
    });
  }

  function render() {
    renderBoard();
    renderSlots();
    appEl.classList.toggle("busy", busy);
  }

  function renderBoard() {
    boardEl.innerHTML = "";
    columns.forEach((stack, ci) => {
      const colEl = document.createElement("div");
      colEl.className = "col";
      colEl.dataset.col = String(ci);
      stack.forEach((tile, ti) => {
        const isTop = ti === stack.length - 1;
        const el = document.createElement("div");
        el.className = "tile" + (isTop ? " top" : "") + (tile.blind ? " blind" : "");
        el.dataset.id = String(tile.id);
        el.dataset.col = String(ci);
        if (tile.blind) {
          el.textContent = "?";
        } else {
          el.textContent = tile.pet;
        }
        if (tile.justFlipped) {
          el.classList.add("flipping");
          tile.justFlipped = false;
        }
        if (tile.hint) {
          el.classList.add("hint");
        }
        if (isTop && !busy && !gameOver) {
          el.addEventListener("click", () => onTileClick(ci));
        }
        colEl.appendChild(el);
      });
      boardEl.appendChild(colEl);
    });
  }

  function renderSlots() {
    slotsEl.innerHTML = "";
    for (let i = 0; i < slotCap(); i++) {
      const slot = document.createElement("div");
      slot.className = "slot" + (slots[i] ? " filled" : "");
      if (slots[i]) {
        const span = document.createElement("span");
        span.className = "slot-emoji";
        span.textContent = slots[i].pet;
        slot.appendChild(span);
        if (slots[i].matching) slot.classList.add("matching");
        if (slots[i].clearing) slot.classList.add("clearing");
      }
      slotsEl.appendChild(slot);
    }
  }

  function boardEmpty() {
    return columns.every((s) => s.length === 0);
  }

  function onTileClick(ci) {
    if (busy || gameOver) return;
    const stack = columns[ci];
    if (!stack.length) return;
    if (slots.length >= slotCap()) return;

    startBattleTimerIfNeeded();
    clearHints();
    busy = true;
    appEl.classList.add("busy");

    const tile = stack.pop();
    // If somehow still blind (shouldn't for top after revealTops), reveal
    if (tile.blind) {
      tile.blind = false;
      tile.justFlipped = true;
    }

    // Move into slots — insert next to same pets if possible for nicer packing,
    // but classic is append to end. Spec: "next empty slot" → append.
    slots.push({ id: tile.id, pet: tile.pet });

    // Flip new top if any
    if (stack.length) {
      const newTop = stack[stack.length - 1];
      if (newTop.blind) {
        newTop.blind = false;
        newTop.justFlipped = true;
      }
    }

    render();

    // After short delay, check matches
    setTimeout(() => {
      tryClearMatches().then(() => {
        busy = false;
        appEl.classList.remove("busy");
        render();
        checkEnd();
        if (!gameOver) saveProgress();
      });
    }, 280);
  }

  function findMatchTriple() {
    const counts = {};
    slots.forEach((s, i) => {
      if (!counts[s.pet]) counts[s.pet] = [];
      counts[s.pet].push(i);
    });
    for (const pet of Object.keys(counts)) {
      if (counts[pet].length >= 3) {
        return counts[pet].slice(0, 3);
      }
    }
    return null;
  }

  function tryClearMatches() {
    return new Promise((resolve) => {
      const indices = findMatchTriple();
      if (!indices) {
        resolve();
        return;
      }
      // Mark matching then clearing
      indices.forEach((i) => {
        slots[i].matching = true;
      });
      renderSlots();

      setTimeout(() => {
        indices.forEach((i) => {
          slots[i].matching = false;
          slots[i].clearing = true;
        });
        renderSlots();

        setTimeout(() => {
          // Remove from highest index first
          const sorted = indices.slice().sort((a, b) => b - a);
          sorted.forEach((i) => slots.splice(i, 1));
          score += 1;
          updateStats();
          renderSlots();
          // Chain clear if another match exists
          setTimeout(() => {
            tryClearMatches().then(resolve);
          }, 80);
        }, 380);
      }, 220);
    });
  }

  function checkEnd() {
    // Matches already resolved by tryClearMatches before this runs.
    if (boardEmpty() && slots.length === 0) {
      win();
      return;
    }
    // Board cleared but leftover unmatched pets in slots → stuck (deal was multiples of 3)
    if (boardEmpty() && slots.length > 0 && !findMatchTriple()) {
      lose();
      return;
    }
    if (slots.length >= slotCap() && !findMatchTriple()) {
      lose();
    }
  }

  function buildBattleResultText(cleared, timeMs, compareLabel) {
    const dLabel = (DIFFICULTIES[difficulty] || DIFFICULTIES.normal).label;
    const payload = { v: 1, seed: battleSeed, d: difficulty, lv: cleared, t: timeMs };
    const link = buildBattleLink(payload);
    let lines = [
      "萌宠排排排 · 对战成绩",
      "第 " + cleared + " 关 · " + dLabel,
      "我的用时：" + formatBattleTime(timeMs),
    ];
    if (compareLabel) lines.push("对决结果：" + compareLabel);
    lines.push("来挑战同一副牌：");
    lines.push(link);
    return { text: lines.join("\n"), link: link, payload: payload };
  }

  async function copyText(str) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(str);
        return true;
      }
    } catch (e) { /* fall through */ }
    try {
      const ta = document.createElement("textarea");
      ta.value = str;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  function win() {
    gameOver = true;
    const cleared = level;
    const nextLevel = cleared + 1;

    if (battleMode) {
      stopBattleTimer();
      const timeMs = battleStartMs ? Date.now() - battleStartMs : 0;
      updateBattleTimerDisplay();
      let compareLabel = "";
      let title = "对战通关！";
      if (battleOpponentTime != null) {
        if (timeMs < battleOpponentTime) {
          compareLabel = "胜";
          title = "对战胜利！";
        } else if (timeMs > battleOpponentTime) {
          compareLabel = "负";
          title = "对战惜败…";
        } else {
          compareLabel = "平";
          title = "对战平手！";
        }
      }
      const result = buildBattleResultText(cleared, timeMs, compareLabel);
      let msg = "用时 " + formatBattleTime(timeMs) + " · 消除 " + score + " 组";
      if (battleOpponentTime != null) {
        msg += "\n对手 " + formatBattleTime(battleOpponentTime) + " · 结果：" + compareLabel;
      }
      columns = [];
      slots = [];
      showOverlay(
        compareLabel === "胜" ? "🏆" : compareLabel === "负" ? "😿" : "🎉",
        title,
        msg,
        [
          {
            text: "复制成绩",
            primary: true,
            action: async () => {
              const ok = await copyText(result.text);
              toast(ok ? "成绩已复制" : "复制失败，请手动复制");
            },
          },
          {
            text: "再战一局",
            primary: false,
            action: () => {
              // Same seed rematch; keep opponent time for comparison
              enterBattle(battleSeed, cleared, difficulty, battleOpponentTime);
            },
          },
          {
            text: "退出对战",
            primary: false,
            action: () => {
              hideOverlay();
              exitBattle({ continuePlay: true });
            },
          },
        ]
      );
      return;
    }

    if (cleared > maxCleared) maxCleared = cleared;
    // Persist unlocked next level so refresh continues forward
    level = nextLevel;
    columns = [];
    slots = [];
    saveProgress({ pendingDeal: true, clearedLevel: cleared });
    level = cleared; // keep UI/modal wording on cleared level until they pick
    showOverlay(
      "🎉",
      "通关！",
      `第 ${cleared} 关完成 · 累计消除 ${score} 组`,
      [
        { text: "下一关", primary: true, action: () => startLevel(nextLevel, true) },
        { text: "再玩一次", primary: false, action: () => startLevel(cleared, false) },
        { text: "选择关卡", primary: false, action: () => { hideOverlay(); openLevelSelect(); } },
      ]
    );
  }

  function lose() {
    gameOver = true;
    columns = [];
    slots = [];
    if (battleMode) {
      stopBattleTimer();
      showOverlay(
        "😿",
        "对战失败…",
        "槽位满了。再战可重开同一副牌～",
        [
          {
            text: "再战一局",
            primary: true,
            action: () => enterBattle(battleSeed, level, difficulty, battleOpponentTime),
          },
          {
            text: "退出对战",
            primary: false,
            action: () => {
              hideOverlay();
              exitBattle({ continuePlay: true });
            },
          },
        ]
      );
      return;
    }
    saveProgress({ pendingDeal: true, score: 0 });
    showOverlay(
      "😿",
      "槽位满了…",
      "再试一次，仔细规划萌宠排队吧！",
      [
        { text: "再试一次", primary: true, action: () => startLevel(level, false) },
        { text: "选择关卡", primary: false, action: () => { hideOverlay(); openLevelSelect(); } },
      ]
    );
  }

  function openLevelSelect() {
    if (busy) return;
    if (battleMode) {
      toast("对战中请先退出对战");
      return;
    }
    const grid = document.getElementById("levelGrid");
    grid.innerHTML = "";
    const maxShow = Math.max(unlockedLevel(), maxCleared, level, 6);
    for (let i = 1; i <= maxShow; i++) {
      const btn = document.createElement("button");
      btn.type = "button";
      const cleared = i <= maxCleared;
      const unlocked = i <= unlockedLevel();
      const isCurrent = i === level && !gameOver;
      btn.className = "level-btn"
        + (cleared ? " cleared" : "")
        + (isCurrent ? " current" : "")
        + (!unlocked ? " locked" : "");
      btn.disabled = !unlocked;
      const mark = document.createElement("span");
      mark.className = "lv-mark";
      if (!unlocked) mark.textContent = "未解锁";
      else if (cleared) mark.textContent = "已通关";
      else if (isCurrent) mark.textContent = "进行中";
      else mark.textContent = "可挑战";
      btn.appendChild(document.createTextNode(String(i)));
      btn.appendChild(mark);
      if (unlocked) {
        btn.addEventListener("click", () => {
          hideLevelSelect();
          hideOverlay();
          startLevel(i, false);
          toast(cleared ? `重玩第 ${i} 关` : `进入第 ${i} 关`);
        });
      }
      grid.appendChild(btn);
    }
    levelOverlayEl.classList.add("show");
  }

  function hideLevelSelect() {
    levelOverlayEl.classList.remove("show");
  }

  function showOverlay(emoji, title, msg, buttons) {
    document.getElementById("modalEmoji").textContent = emoji;
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalMsg").textContent = msg;
    const btns = document.getElementById("modalBtns");
    btns.innerHTML = "";
    buttons.forEach((b) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = b.primary ? "btn-primary" : "btn-secondary";
      btn.textContent = b.text;
      btn.addEventListener("click", b.action);
      btns.appendChild(btn);
    });
    overlayEl.classList.add("show");
  }

  function hideOverlay() {
    overlayEl.classList.remove("show");
  }

  function clearHints() {
    columns.forEach((stack) =>
      stack.forEach((t) => {
        t.hint = false;
      })
    );
  }

  function showHint() {
    if (busy || gameOver) return;
    clearHints();
    if (slots.length >= slotCap()) {
      toast("槽位已满，无法提示");
      return;
    }

    // Prefer a top tile whose pet already has 1 or 2 in slots
    const slotCounts = {};
    slots.forEach((s) => (slotCounts[s.pet] = (slotCounts[s.pet] || 0) + 1));

    let best = null;
    let bestScore = -1;
    columns.forEach((stack, ci) => {
      if (!stack.length) return;
      const top = stack[stack.length - 1];
      const pet = top.pet;
      const sc = slotCounts[pet] || 0;
      // Prefer completing a match (sc===2), then adding to existing (sc===1),
      // then new pet if space allows (leave room)
      let scoreH = 0;
      if (sc === 2) scoreH = 100;
      else if (sc === 1) scoreH = 50;
      else if (slots.length <= slotCap() - 3) scoreH = 20;
      else scoreH = 5;
      // Prefer revealed (already are)
      if (scoreH > bestScore) {
        bestScore = scoreH;
        best = { ci, tile: top };
      }
    });

    if (!best) {
      toast("没有可点的方块啦");
      return;
    }
    best.tile.hint = true;
    renderBoard();
    toast("试试点高亮的萌宠～");
    setTimeout(() => {
      clearHints();
      renderBoard();
    }, 2500);
  }

  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
  }

  function fitBoard() {
    const n = Math.max(columns.length || 7, 1);
    const wrap = document.querySelector(".board-wrap");
    if (!wrap) return;
    const style = getComputedStyle(wrap);
    const padX = (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0);
    const avail = Math.max(120, wrap.clientWidth - padX);
    const gap = n >= 10 ? 2 : n >= 8 ? 3 : 5;
    let tile = Math.floor((avail - gap * (n - 1)) / n);
    const isLandscape = window.matchMedia("(orientation: landscape)").matches;
    const maxTile = isLandscape ? 56 : 50;
    const minTile = isLandscape ? 30 : 28;
    tile = Math.max(minTile, Math.min(maxTile, tile));
    const root = document.documentElement;
    root.style.setProperty("--tile", tile + "px");
    root.style.setProperty("--gap", gap + "px");
    root.style.setProperty("--tile-font", Math.max(14, Math.round(tile * 0.58)) + "px");

    const tip = document.getElementById("orientTip");
    if (tip) {
      const narrow = window.innerWidth < 430;
      const portrait = !isLandscape;
      tip.classList.toggle("show", portrait && narrow && n >= 8);
    }
  }

  function scheduleFit() {
    requestAnimationFrame(() => {
      fitBoard();
      // second pass after fonts/layout settle
      requestAnimationFrame(fitBoard);
    });
  }

  const _renderBoard = renderBoard;
  renderBoard = function () {
    _renderBoard();
    scheduleFit();
  };

  function setDifficulty(next, restart) {
    if (!DIFFICULTIES[next]) return;
    if (battleMode) {
      toast("对战中难度已锁定");
      updateStats();
      return;
    }
    if (next === difficulty && !restart) {
      updateStats();
      return;
    }
    difficulty = next;
    updateStats();
    saveProgress({ pendingDeal: true, columns: [], slots: [] });
    if (restart !== false) {
      // Changing difficulty starts a fresh deal on the current level
      startLevel(level, false);
      toast(`难度：${DIFFICULTIES[difficulty].label}`);
    }
  }

  document.getElementById("diffBar").addEventListener("click", (e) => {
    const btn = e.target.closest(".diff-chip");
    if (!btn || busy) return;
    setDifficulty(btn.dataset.diff, true);
  });

  document.getElementById("btnRestart").addEventListener("click", () => {
    if (busy) return;
    if (battleMode) {
      enterBattle(battleSeed, level, difficulty, battleOpponentTime);
      toast("同一副牌再战");
      return;
    }
    startLevel(level, false);
  });
  document.getElementById("btnHint").addEventListener("click", showHint);
  document.getElementById("btnLevels").addEventListener("click", () => {
    if (busy) return;
    openLevelSelect();
  });
  document.getElementById("btnCloseLevels").addEventListener("click", hideLevelSelect);
  levelOverlayEl.addEventListener("click", (e) => {
    if (e.target === levelOverlayEl) hideLevelSelect();
  });

  // Block iOS double-tap zoom without killing clicks
  let lastTouchEnd = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      e.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
  document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });

  window.addEventListener("resize", scheduleFit);
  window.addEventListener("orientationchange", () => setTimeout(scheduleFit, 120));

  function hideBattleInvite() {
    const el = document.getElementById("battleOverlay");
    if (el) el.classList.remove("show");
  }

  function showBattleInvite(payload) {
    pendingInvitePayload = payload;
    const link = buildBattleLink(payload);
    const box = document.getElementById("battleInviteLink");
    const hint = document.getElementById("battleInviteHint");
    if (box) box.textContent = link;
    if (hint) {
      const dLabel = (DIFFICULTIES[payload.d] || DIFFICULTIES.normal).label;
      hint.textContent =
        "第 " + payload.lv + " 关 · " + dLabel + " · 种子已锁定。复制链接发给好友，双方同一副牌比速度～";
    }
    document.getElementById("battleOverlay").classList.add("show");
  }

  function openBattleComposer() {
    if (busy) return;
    if (battleMode) {
      toast("已在对战中");
      return;
    }
    const payload = {
      v: 1,
      seed: makeSeed(),
      d: difficulty,
      lv: level,
    };
    showBattleInvite(payload);
  }

  document.getElementById("btnBattle").addEventListener("click", openBattleComposer);
  document.getElementById("btnCloseBattle").addEventListener("click", () => {
    pendingInvitePayload = null;
    hideBattleInvite();
  });
  document.getElementById("battleOverlay").addEventListener("click", (e) => {
    if (e.target === document.getElementById("battleOverlay")) {
      pendingInvitePayload = null;
      hideBattleInvite();
    }
  });
  document.getElementById("btnCopyInvite").addEventListener("click", async () => {
    if (!pendingInvitePayload) return;
    const link = buildBattleLink(pendingInvitePayload);
    const ok = await copyText(link);
    toast(ok ? "邀请链接已复制" : "复制失败，请手动复制");
  });
  document.getElementById("btnStartBattle").addEventListener("click", () => {
    if (!pendingInvitePayload) return;
    const p = pendingInvitePayload;
    hideBattleInvite();
    enterBattle(p.seed, p.lv, p.d, null);
    toast("对战开始 · 点击方块计时");
  });

  // Kick off — battle invite from URL takes priority; never write battle into SP save
  let bootBattle = null;
  try {
    const sp = new URLSearchParams(location.search);
    const raw = sp.get("b");
    if (raw) bootBattle = decodeBattlePayload(raw);
  } catch (e) {
    bootBattle = null;
  }

  // Still load maxCleared / difficulty meta for single-player continuity after battle
  const saved = loadProgress();
  if (saved) {
    maxCleared = Math.max(0, Math.floor(saved.maxCleared) || 0);
    if (saved.clearedLevel) {
      maxCleared = Math.max(maxCleared, Math.floor(saved.clearedLevel) || 0);
    }
  }

  if (bootBattle) {
    if (saved && saved.difficulty && DIFFICULTIES[saved.difficulty] && !bootBattle.d) {
      /* keep */
    }
    enterBattle(bootBattle.seed, bootBattle.lv, bootBattle.d, bootBattle.t);
    if (bootBattle.t != null) {
      toast("对战挑战 · 对手用时 " + formatBattleTime(bootBattle.t));
    } else {
      toast("对战模式 · 点击方块开始计时");
    }
  } else if (saved) {
    if (saved.difficulty && DIFFICULTIES[saved.difficulty]) {
      difficulty = saved.difficulty;
    }
    const hasBoard = saved.columns.some((c) => c && c.length);
    const hasSlots = saved.slots && saved.slots.length > 0;
    if (!saved.pendingDeal && (hasBoard || hasSlots)) {
      restoreProgress(saved);
    } else {
      const startLv = Math.max(1, Math.floor(saved.level) || 1);
      startLevel(startLv, false);
      if (typeof saved.score === "number" && saved.score > 0 && saved.pendingDeal) {
        score = saved.score;
        updateStats();
        saveProgress();
      }
    }
  } else {
    startLevel(1, false);
  }
  setBattleUi();
  scheduleFit();
})();
</script>
</body>
</html>
